name: lifeflow_app
description: "Prontuário digital da vida do veículo."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.35.0
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  http: ^1.6.0
  path: ^1.9.1
